<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan Digital — UNDANG AKU DONG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Lora:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes kenBurns {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .motion-photo { animation: kenBurns 18s ease-in-out infinite; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .morph-element { animation: floatSlow 4.5s ease-in-out infinite; }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .spin-disc { animation: spinSlow 8s linear infinite; }
    .paused-disc { animation-play-state: paused; }

    html { scroll-behavior: smooth; }

    /* Animasi masuk section yang halus & berkelas */
    .reveal {
      opacity: 0;
      transform: translateY(34px) scale(0.985);
      filter: blur(3px);
      transition:
        opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1.25s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform, filter;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    /* Gerakan hidup berkelanjutan (ambient motion) untuk foto, kartu, dan elemen dekoratif */
    @keyframes gentleBreathe {
      0%, 100% { transform: scale(1) translate3d(0, 0, 0); }
      50% { transform: scale(1.045) translate3d(0, -4px, 0); }
    }
    .motion-photo {
      animation: gentleBreathe 12s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes swayDrift {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(0, -6px, 0) rotate(0.7deg); }
    }
    .morph-element {
      animation: swayDrift 7.5s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes shimmerGlow {
      0%, 100% { box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.14); }
      50% { box-shadow: 0 18px 34px -8px rgba(180, 138, 78, 0.28); }
    }
    .morph-card {
      animation: shimmerGlow 8s ease-in-out infinite;
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.65s ease;
    }
    .morph-card:hover {
      transform: translateY(-4px) scale(1.01);
    }


    /* =====================================================================
       PPT SHARED-ELEMENT MORPH SYSTEM (ALL THEMES & LAYOUT ENGINES)
       ===================================================================== */
    .morph-card {
      border-radius: 22px;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.75s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.75s ease;
      will-change: transform, border-radius;
    }
    .morph-card:hover {
      transform: translateY(-3px);
    }

    .morph-photo {
      border-radius: 16px;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, border-radius;
    }

    .morph-element {
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, border-radius;
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 1s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Elemen kloning shared-element yang benar-benar meluncur & berubah bentuk (morph) dari elemen asal ke elemen tujuan */
    .ppt-morph-clone {
      position: fixed;
      z-index: 48;
      pointer-events: none;
      object-fit: cover;
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.28);
      transition:
        left 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        border-radius 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.95s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.55s ease;
      will-change: left, top, width, height, border-radius, transform, opacity;
    }

    #morphTransitionStage {
      display: none;
    }

    /* Overlay transisi halus saat navigasi antar bagian/slide */
    #slideTransitionCurtain {
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      background: radial-gradient(circle at center, rgba(255,255,255,0.22), rgba(0,0,0,0.28));
      backdrop-filter: blur(2px);
    }
    #slideTransitionCurtain.active {
      opacity: 1;
    }

    /* Pola Batik Halus untuk Tema Adat */
    .batik-pattern {
      background-image: radial-gradient(circle at 2px 2px, rgba(212,175,55,0.14) 1px, transparent 0);
      background-size: 22px 22px;
    }
  </style>
</head>
<body id="pageBody" class="min-h-screen flex justify-center transition-colors duration-500">
  <audio id="bgAudioPlayer" loop preload="auto"></audio>

  <!-- DYNAMIC COVER OVERLAY (BERBEDA TIAP LAYOUT ENGINE) -->
  <div id="coverOverlay" class="fixed inset-0 z-50 flex justify-center bg-black/85 backdrop-blur-md transition-all duration-1000 ease-[cubic-bezier(0.76,0,0.24,1)]">
    <div id="coverSlot" class="w-full max-w-[460px] h-full relative overflow-hidden shadow-2xl"></div>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="w-full max-w-6xl min-h-screen flex justify-center lg:shadow-2xl">
    
    <!-- LEFT DESKTOP SHOWCASE -->
    <aside class="hidden lg:flex lg:w-7/12 sticky top-0 h-screen relative overflow-hidden flex-col justify-end p-12 text-white">
      <img id="desktopBgImg" src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1400&q=90" class="absolute inset-0 w-full h-full object-cover motion-photo" alt="Prewedding">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/35 to-black/15"></div>
      <div class="relative z-10 space-y-3 max-w-lg">
        <span id="deskBadge" class="inline-block px-3.5 py-1 rounded-full bg-white/15 backdrop-blur border border-white/25 text-[11px] uppercase tracking-[0.25em]">
          Exclusive Wedding Invitation
        </span>
        <h2 id="deskCouple" class="text-6xl leading-none">Dewi &amp; Ihab</h2>
        <p id="deskDate" class="text-sm tracking-[0.2em] uppercase text-white/85 pt-1">Sabtu, 31 Oktober 2026</p>
        <p class="text-xs text-white/70 leading-relaxed pt-2">
          “Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu pasangan hidup agar kamu merasa tenteram kepadanya.” (Q.S. Ar-Rum: 21)
        </p>
      </div>
    </aside>

    <!-- RIGHT / MOBILE DYNAMIC STREAM (DI-RENDER SESUAI ARSITEKTUR TEMA) -->
    <main id="invitationStream" class="w-full lg:w-5/12 max-w-[480px] min-h-screen relative pb-28 shadow-2xl overflow-hidden">
      <div id="slideTransitionCurtain" class="fixed inset-0 lg:left-auto lg:w-5/12 lg:max-w-[480px] z-30"></div>
      <div id="morphTransitionStage"></div>
      <div id="dynamicLayoutRoot"></div>

      <!-- FLOATING AUDIO BUTTON -->
      <button onclick="toggleMusic()" id="musicBtn" title="Putar / Jeda Musik" class="fixed bottom-20 right-4 lg:right-[calc(50%-36rem+20px)] z-40 w-10 h-10 rounded-full bg-slate-900 text-white shadow-lg flex items-center justify-center text-sm spin-disc paused-disc">
        🎵
      </button>

      <!-- FLOATING BOTTOM NAV -->
      <nav class="fixed bottom-3 left-1/2 -translate-x-1/2 lg:left-auto lg:translate-x-0 lg:right-[calc(50%-36rem+24px)] z-40 w-[92%] max-w-[420px] bg-white/95 backdrop-blur-md border border-black/10 rounded-full px-3 py-2 shadow-xl flex items-center justify-around text-[10px] font-bold text-slate-700">
        <a href="#sec-home" onclick="smoothGlideTo('sec-home', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>🏠</span>Sampul</a>
        <a href="#sec-mempelai" onclick="smoothGlideTo('sec-mempelai', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>💑</span>Mempelai</a>
        <a href="#sec-acara" onclick="smoothGlideTo('sec-acara', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>📅</span>Acara</a>
        <a href="#sec-galeri" onclick="smoothGlideTo('sec-galeri', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>🖼️</span>Galeri</a>
        <a href="#sec-gift" onclick="smoothGlideTo('sec-gift', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>🎁</span>Kado</a>
        <a href="#sec-ucapan" onclick="smoothGlideTo('sec-ucapan', event)" class="flex flex-col items-center gap-0.5 hover:text-amber-600 transition duration-300"><span>💬</span>Ucapan</a>
      </nav>
    </main>
  </div>

  <script src="themes.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const guestParam = urlParams.get('kpd') || urlParams.get('to') || 'Bapak Budi';
    const fromEditor = urlParams.get('fromEditor');

    let data = {
      theme: urlParams.get('theme') || 'vogue-editorial-noir',
      brideNick: 'Dewi',
      groomNick: 'Ihab',
      brideFull: 'Dewi Anisa, S.Pd.',
      groomFull: 'Ihab Taufik, S.Akt.',
      brideParents: 'Putri ke-1 dari Bpk. Sodri & Ibu Mamah Marhamah',
      groomParents: 'Putra ke-2 dari Bpk. H. Yaya Ruwiya Dinata & Ibu Alfin Taslim',
      dateText: 'Sabtu, 31 Oktober 2026',
      timeText: '08.00 WIB - Selesai',
      venue: 'Grand Ballroom Hotel Harmoni, Jl. Merdeka No. 45, Bandung',
      mapsUrl: 'https://maps.google.com',
      quote: 'Dan di antara tanda-tanda kekuasaan-Nya ialah Dia menciptakan untukmu pasangan hidup agar kamu merasa tenteram kepadanya.',
      musicType: 'preset',
      musicPreset: 'piano',
      customAudioData: '',
      customAudioUrl: '',
      customSongTitle: '',
      bankName: 'Bank BCA',
      bankAcc: '7750912834',
      coverPhoto: '',
      bridePhoto: '',
      groomPhoto: '',
      gallery1: '',
      gallery2: '',
      gallery3: '',
      gallery4: ''
    };

    if (fromEditor && localStorage.getItem('undangakudong_draft')) {
      data = { ...data, ...JSON.parse(localStorage.getItem('undangakudong_draft')) };
    }
    if (urlParams.get('theme')) data.theme = urlParams.get('theme');

    const t = UNDANGAKUDONG_THEMES.find(item => item.id === data.theme) || UNDANGAKUDONG_THEMES[0];
    const p = t.palette;

    document.title = `The Wedding of ${data.brideNick} & ${data.groomNick} — UNDANG AKU DONG`;
    document.getElementById('pageBody').style.background = p.bgOuter;
    document.getElementById('invitationStream').style.background = p.bgMain;
    document.getElementById('invitationStream').style.color = p.textDark;
    document.getElementById('deskCouple').style.fontFamily = t.fonts.display;
    document.getElementById('deskCouple').innerHTML = `${data.brideNick} &amp; ${data.groomNick}`;
    document.getElementById('deskDate').textContent = data.dateText;
    document.getElementById('deskBadge').textContent = t.badge;
    if (data.coverPhoto) document.getElementById('desktopBgImg').src = data.coverPhoto;
    document.getElementById('musicBtn').style.background = p.primary;

    // =========================================================================
    // 1. RENDER SAMPUL PEMBUKA (BERBEDA TIAP LAYOUT ENGINE!)
    // =========================================================================
    const coverSlot = document.getElementById('coverSlot');
    if (t.layoutEngine === 'envelope') {
      // SAMPUL AMPLOP FISIK + SEGEL LILIN WAX SEAL
      coverSlot.innerHTML = `
        <div class="w-full h-full flex flex-col justify-between items-center p-7 text-center relative" style="background:${p.bgMain}; color:${p.textDark};">
          <div class="pt-4 space-y-1">
            <p class="text-[10px] uppercase tracking-[0.35em]" style="color:${p.textMuted};">Official Wedding Invitation</p>
            <h1 class="text-4xl font-bold" style="font-family:${t.fonts.display}; color:${p.primary};">${data.brideNick} &amp; ${data.groomNick}</h1>
          </div>

          <!-- Amplop Surat 3D dengan Segel Lilin -->
          <div class="relative w-full max-w-xs aspect-[4/3] rounded-2xl shadow-2xl border-2 flex flex-col items-center justify-center p-6 overflow-hidden" style="background:#EFE6D8; border-color:${p.accent};">
            <!-- Flap Segitiga Atas -->
            <div class="absolute top-0 left-0 right-0 h-1/2 border-b shadow-sm" style="background:#E6D9C6; clip-path: polygon(0 0, 50% 100%, 100% 0); border-color:${p.accent};"></div>
            
            <!-- Wax Seal Button -->
            <button onclick="bukaUndangan()" class="relative z-20 w-20 h-20 rounded-full shadow-xl flex flex-col items-center justify-center text-white font-serif border-4 border-amber-200/40 hover:scale-110 transition transform cursor-pointer" style="background:radial-gradient(circle at 30% 30%, #B91C1C, #7F1D1D);">
              <span class="text-lg font-bold tracking-widest">${data.brideNick[0]}&amp;${data.groomNick[0]}</span>
              <span class="text-[8px] uppercase tracking-widest opacity-80">Buka</span>
            </button>

            <div class="relative z-10 mt-6 text-center">
              <p class="text-[10px] uppercase tracking-widest opacity-70">Kepada Yth:</p>
              <p class="text-base font-extrabold mt-0.5">${guestParam}</p>
            </div>
          </div>

          <button onclick="bukaUndangan()" class="w-full max-w-xs py-3.5 rounded-full text-xs font-bold uppercase tracking-[0.2em] text-white shadow-lg" style="background:${p.primary};">
            Ketuk Segel Untuk Membuka
          </button>
        </div>
      `;
    } else if (t.layoutEngine === 'editorial') {
      // SAMPUL MAJALAH VOGUE FULL-BLEED
      coverSlot.innerHTML = `
        <div class="w-full h-full relative flex flex-col justify-between p-8 text-white">
          <img src="${data.coverPhoto || "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=85"}" class="absolute inset-0 w-full h-full object-cover motion-photo ${t.id.includes('monochrome') ? 'grayscale' : ''}" alt="Editorial">
          <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-black/40"></div>
          
          <div class="relative z-10 flex justify-between items-center border-b border-white/30 pb-3 text-[10px] tracking-[0.3em] uppercase">
            <span>VOL. 2026</span>
            <span>THE WEDDING ISSUE</span>
          </div>

          <div class="relative z-10 space-y-5 text-left">
            <div>
              <p class="text-xs uppercase tracking-[0.3em] text-white/75 mb-1">Save The Date — ${data.dateText}</p>
              <h1 class="text-6xl font-extrabold leading-[0.95] tracking-tight" style="font-family:${t.fonts.display};">
                ${data.brideNick}<br><span class="italic font-normal text-4xl text-amber-300">&amp;</span> ${data.groomNick}
              </h1>
            </div>

            <div class="p-4 rounded-xl bg-white/10 backdrop-blur-md border border-white/20">
              <p class="text-[10px] uppercase tracking-widest text-white/70">Exclusive Invitation For:</p>
              <p class="text-lg font-bold mt-0.5">${guestParam}</p>
            </div>

            <button onclick="bukaUndangan()" class="w-full py-4 bg-white text-black font-extrabold text-xs uppercase tracking-[0.25em] hover:bg-amber-100 transition">
              Read Invitation &rarr;
            </button>
          </div>
        </div>
      `;
    } else if (t.layoutEngine === 'polaroid') {
      // SAMPUL SCRAPBOOK POLAROID MIRING
      coverSlot.innerHTML = `
        <div class="w-full h-full flex flex-col justify-between items-center p-7 text-center relative" style="background:${p.bgMain}; color:${p.textDark};">
          <div class="pt-3">
            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest bg-amber-900/10" style="color:${p.primary};">Our Love Story</span>
            <h1 class="text-5xl mt-2" style="font-family:${t.fonts.script}; color:${p.primary};">${data.brideNick} &amp; ${data.groomNick}</h1>
          </div>

          <!-- Polaroid Card Miring -->
          <div class="relative bg-white p-3.5 pb-8 shadow-2xl border border-stone-200 -rotate-3 w-64 morph-element">
            <div class="w-24 h-5 bg-amber-200/70 absolute -top-2.5 left-1/2 -translate-x-1/2 rotate-2"></div>
            <div class="w-full h-56 overflow-hidden bg-stone-100">
              <img src="${data.coverPhoto || 'https://images.unsplash.com/photo-1606800052052-a08af7148866?auto=format&fit=crop&w=600&q=80'}" class="w-full h-full object-cover" alt="Polaroid">
            </div>
            <p class="mt-3 text-xl" style="font-family:${t.fonts.script}; color:${p.textDark};">${data.dateText}</p>
          </div>

          <div class="w-full max-w-xs space-y-3">
            <div class="p-3.5 rounded-xl bg-white border border-stone-200 shadow-sm">
              <p class="text-[10px] text-stone-500">Special Guest:</p>
              <p class="text-base font-bold">${guestParam}</p>
            </div>
            <button onclick="bukaUndangan()" class="w-full py-3.5 rounded-xl text-xs font-bold uppercase tracking-widest text-white shadow-lg" style="background:${p.primary};">
              Buka Album Undangan
            </button>
          </div>
        </div>
      `;
    } else if (t.layoutEngine === 'javanese') {
      // SAMPUL KERATON JAWA / SUNDA DENGAN GUNUNGAN WAYANG
      coverSlot.innerHTML = `
        <div class="w-full h-full batik-pattern flex flex-col justify-between items-center p-7 text-center relative" style="background:${p.bgMain}; color:${p.textDark};">
          <div class="absolute inset-3 border-2 pointer-events-none" style="border-color:${p.primary};"></div>
          <div class="absolute inset-5 border pointer-events-none opacity-50" style="border-color:${p.primary};"></div>

          <div class="relative z-10 pt-4">
            <p class="text-[10px] uppercase tracking-[0.35em]" style="color:${p.primary};">Pawiwahan Ageng</p>
            <h1 class="text-3xl sm:text-4xl font-bold mt-2 leading-snug" style="font-family:${t.fonts.display}; color:${p.primary};">${data.brideNick}<br>&amp;<br>${data.groomNick}</h1>
          </div>

          <!-- Gunungan SVG Besar -->
          <div class="relative z-10 my-1 morph-element">
            <svg viewBox="0 0 200 230" class="w-44 h-52 mx-auto" fill="none" stroke="${p.primary}" stroke-width="1.6">
              <path d="M100 10 C138 55, 178 110, 188 215 L12 215 C22 110, 62 55, 100 10 Z" fill="${p.primary}" fill-opacity="0.08"/>
              <path d="M100 28 C130 68, 162 115, 170 205 L30 205 C38 115, 70 68, 100 28 Z" stroke-dasharray="4 3"/>
              <circle cx="100" cy="125" r="28" />
              <path d="M100 42 L100 205 M62 125 L138 125" opacity="0.65"/>
            </svg>
          </div>

          <div class="relative z-10 w-full max-w-xs space-y-3 pb-2">
            <div class="p-3.5 border backdrop-blur-sm" style="background:${p.bgCard}; border-color:${p.border};">
              <p class="text-[10px] opacity-75">Katur Dhumateng Bapak/Ibu/Saudara/i:</p>
              <p class="text-base font-bold mt-0.5" style="color:${p.primary};">${guestParam}</p>
            </div>
            <button onclick="bukaUndangan()" class="w-full py-3.5 font-bold text-xs uppercase tracking-[0.2em] text-black shadow-xl" style="background:${p.primary};">
              Buka Serat Undangan
            </button>
          </div>
        </div>
      `;
    } else if (t.layoutEngine === 'islamic') {
      // SAMPUL ISLAMI KUBAH MASJID & KALIGRAFI
      coverSlot.innerHTML = `
        <div class="w-full h-full flex flex-col justify-between items-center p-7 text-center relative" style="background:${p.bgMain}; color:${p.textDark};">
          <div class="pt-4 space-y-2">
            <p class="text-xl font-serif" style="color:${p.primary};">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>
            <p class="text-[10px] uppercase tracking-[0.3em] opacity-80">Walimatul ‘Ursy</p>
          </div>

          <!-- Kubah Masjid Arch -->
          <div class="w-64 py-10 px-5 rounded-t-full border-2 flex flex-col items-center justify-center space-y-2 shadow-2xl" style="background:${p.bgCard}; border-color:${p.primary};">
            <span class="text-2xl">🕌</span>
            <h1 class="text-4xl font-bold leading-tight" style="font-family:${t.fonts.display}; color:${p.primary};">${data.brideNick}<br>&amp;<br>${data.groomNick}</h1>
            <p class="text-xs opacity-80 pt-1">${data.dateText}</p>
          </div>

          <div class="w-full max-w-xs space-y-3 pb-2">
            <div class="p-3.5 rounded-2xl border" style="background:${p.bgCard}; border-color:${p.border};">
              <p class="text-[10px] opacity-75">Kepada Yth. Bapak/Ibu/Saudara/i:</p>
              <p class="text-base font-bold mt-0.5">${guestParam}</p>
            </div>
            <button onclick="bukaUndangan()" class="w-full py-3.5 rounded-full font-bold text-xs uppercase tracking-[0.2em] text-slate-900 shadow-lg" style="background:${p.primary};">
              Buka Undangan Walimah
            </button>
          </div>
        </div>
      `;
    } else {

    const bgAudio = document.getElementById('bgAudioPlayer');
    let audioCtx = null, isPlaying = false, timer = null, usingHtmlAudio = false;

    function resolveAudioSource() {
      if (data.musicType === 'upload' && data.customAudioData) return data.customAudioData;
      if (data.musicType === 'url' && data.customAudioUrl) return data.customAudioUrl;
      return '';
    }

    function startSynthFallback() {
      usingHtmlAudio = false;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isPlaying = true;
      document.getElementById('musicBtn').classList.remove('paused-disc');
      const scales = {
        piano: [261.63, 329.63, 392.00, 493.88, 523.25, 493.88, 392.00, 329.63],
        marry: [293.66, 369.99, 440.00, 587.33, 440.00, 369.99],
        nasyid: [220.00, 261.63, 329.63, 392.00, 329.63, 261.63],
        gamelan: [261.63, 293.66, 329.63, 392.00, 440.00, 392.00, 329.63]
      };
      const notes = scales[data.musicPreset] || scales.piano;
      let i = 0;
      clearInterval(timer);
      timer = setInterval(() => {
        if (!isPlaying) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(notes[i++ % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1.6);
      }, 1100);
    }

    function startMusic() {
      const customSrc = resolveAudioSource();
      if (customSrc) {
        usingHtmlAudio = true;
        if (bgAudio.src !== customSrc) bgAudio.src = customSrc;
        bgAudio.play().then(() => {
          isPlaying = true;
          document.getElementById('musicBtn').classList.remove('paused-disc');
        }).catch(() => {
          startSynthFallback();
        });
      } else {
        startSynthFallback();
      }
    }

    function toggleMusic() {
      if (isPlaying) {
        isPlaying = false;
        if (usingHtmlAudio) bgAudio.pause();
        clearInterval(timer);
        document.getElementById('musicBtn').classList.add('paused-disc');
      } else {
        startMusic();
      }
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateScrollTo(targetEl, duration = 1250) {
      if (!targetEl) return;
      const stream = document.getElementById('invitationStream');
      const useWindow = window.innerWidth < 1024 || !stream;
      const startY = useWindow ? window.scrollY : stream.scrollTop;
      const targetRect = targetEl.getBoundingClientRect();
      const targetY = useWindow
        ? startY + targetRect.top - 16
        : startY + (targetRect.top - stream.getBoundingClientRect().top) - 16;
      const distance = targetY - startY;
      let startTime = null;

      function step(currentTime) {
        if (!startTime) startTime = currentTime;
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const nextPos = startY + distance * easeInOutCubic(progress);

        if (useWindow) {
          window.scrollTo(0, nextPos);
        } else {
          stream.scrollTo(0, nextPos);
        }

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    function runSharedMorph(sourceEl, destEl, duration = 950) {
      if (!sourceEl || !destEl) return;
      const sRect = sourceEl.getBoundingClientRect();
      if (sRect.width < 12 || sRect.height < 12) return;

      const sStyle = window.getComputedStyle(sourceEl);
      const clone = document.createElement('div');
      clone.className = 'ppt-morph-clone';
      clone.style.left = sRect.left + 'px';
      clone.style.top = sRect.top + 'px';
      clone.style.width = sRect.width + 'px';
      clone.style.height = sRect.height + 'px';
      clone.style.borderRadius = sStyle.borderRadius || '18px';
      clone.style.background = sStyle.backgroundColor && sStyle.backgroundColor !== 'rgba(0, 0, 0, 0)'
        ? sStyle.backgroundColor
        : (p.bgCard || '#ffffff');
      clone.style.border = `2px solid ${p.primary || '#D4AF37'}`;

      if (sourceEl.tagName === 'IMG') {
        const imgClone = document.createElement('img');
        imgClone.src = sourceEl.currentSrc || sourceEl.src;
        imgClone.className = 'w-full h-full object-cover ' + (imgFilter || '');
        imgClone.style.borderRadius = 'inherit';
        clone.style.border = 'none';
        clone.style.background = 'transparent';
        clone.appendChild(imgClone);
      }

      document.body.appendChild(clone);
      sourceEl.style.opacity = '0.25';

      requestAnimationFrame(() => {
        const dRect = destEl.getBoundingClientRect();
        const dStyle = window.getComputedStyle(destEl);
        clone.style.left = dRect.left + 'px';
        clone.style.top = dRect.top + 'px';
        clone.style.width = Math.max(dRect.width, 40) + 'px';
        clone.style.height = Math.max(dRect.height, 40) + 'px';
        clone.style.borderRadius = dStyle.borderRadius || '20px';
      });

      setTimeout(() => {
        clone.style.opacity = '0';
        sourceEl.style.opacity = '';
        destEl.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
        destEl.style.transform = 'scale(1.02)';
        setTimeout(() => {
          destEl.style.transform = '';
          clone.remove();
        }, 420);
      }, duration);
    }

    function pickBestVisual(container) {
      if (!container) return null;
      const imgs = Array.from(container.querySelectorAll('img')).filter(im => {
        const r = im.getBoundingClientRect();
        return r.width > 20 && r.height > 20 && r.bottom > 0 && r.top < window.innerHeight;
      });
      if (imgs.length) return imgs[0];
      const cards = Array.from(container.querySelectorAll('div, section')).filter(el => {
        const r = el.getBoundingClientRect();
        return r.width > 60 && r.height > 60 && r.bottom > 0 && r.top < window.innerHeight;
      });
      return cards[0] || null;
    }

    function smoothGlideTo(sectionId, ev) {
      if (ev) ev.preventDefault();
      const target = document.getElementById(sectionId);
      const stream = document.getElementById('invitationStream');
      if (target) {
        target.classList.add('visible');
        const fromEl = pickBestVisual(stream);
        const toEl = target.querySelector('img, .morph-card, .morph-element') || target;
        animateScrollTo(target, 900);
        setTimeout(() => {
          const freshTo = target.querySelector('img, .morph-card, .morph-element') || target;
          if (fromEl && freshTo && fromEl !== freshTo) {
            runSharedMorph(fromEl, freshTo, 850);
          }
        }, 260);
      }
    }

    function bukaUndangan() {
      const cov = document.getElementById('coverOverlay');
      const firstSec = document.getElementById('sec-mempelai');
      const coverVisual = cov ? cov.querySelector('img, .morph-element, button') : null;
      const targetVisual = firstSec ? firstSec.querySelector('img, .morph-card, .morph-element') : null;

      if (coverVisual && targetVisual) {
        runSharedMorph(coverVisual, targetVisual, 950);
      }

      cov.style.transition = 'transform 1.05s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1)';
      cov.style.transform = 'translateY(-100%)';
      cov.style.opacity = '0';
      setTimeout(() => cov.style.display = 'none', 1100);
      startMusic();
      setTimeout(() => {
        triggerReveal();
        if (firstSec) firstSec.classList.add('visible');
      }, 250);
    }

    function kirimUcapan() {
      const s = document.getElementById('wishSender').value || 'Tamu';
      const m = document.getElementById('wishText').value.trim();
      if (!m) return;
      document.getElementById('wishList').insertAdjacentHTML('afterbegin', `
        <div class="p-3 rounded-xl border text-xs" style="border-color:${p.border};">
          <p class="font-bold">${s}</p>
          <p class="opacity-80 mt-0.5">${m}</p>
        </div>
      `);
      document.getElementById('wishText').value = '';
    }

    function triggerReveal() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach((e, idx) => {
          if (e.isIntersecting) {
            setTimeout(() => {
              e.target.classList.add('visible');
            }, idx * 90);
            obs.unobserve(e.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }
    if (urlParams.get('open') === '1') {
      const cov = document.getElementById('coverOverlay');
      if (cov) cov.style.display = 'none';
    }
    triggerReveal();
  </script>
</body>
